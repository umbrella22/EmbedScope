name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish or resume (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Validate release source
        id: version
        run: |
          python3 scripts/release.py identity "$RELEASE_TAG"
          echo "version=$(python3 scripts/release.py version "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

  validate:
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          targets: riscv32imafc-unknown-none-elf
      - run: python3 scripts/release.py identity "$RELEASE_TAG"
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash scripts/check.sh
      - run: python3 scripts/release.py verify "$RELEASE_TAG"
      - name: Retain verified source artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-source
          path: target/dist/
          if-no-files-found: error
          retention-days: 30

  build:
    needs: identity
    uses: ./.github/workflows/native-distributions.yml
    with:
      source_ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    name: Publish crates with Trusted Publishing
    if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: python3 scripts/release.py identity "$RELEASE_TAG"
      - name: Obtain temporary crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish and reconcile all six packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 scripts/release.py publish "$RELEASE_TAG"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-publication
          path: target/dist/
          if-no-files-found: warn
          retention-days: 30

  registry:
    name: Verify public crates before releasing binaries
    needs: [validate, build, publish]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: python3 scripts/release.py identity "$RELEASE_TAG"
      - run: python3 scripts/release.py registry "$RELEASE_TAG"
      - name: Retain public verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-registry
          path: target/dist/
          if-no-files-found: warn
          retention-days: 30

  github-release:
    name: Publish GitHub Release assets
    needs: [identity, validate, build, registry]
    # An upstream publish job may be intentionally skipped in manual mode.
    if: >-
      !cancelled() && needs.identity.result == 'success' && needs.validate.result == 'success' &&
      needs.build.result == 'success' && needs.registry.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.release_tag || github.ref_name) }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: target/collected
      - name: Publish verified Inspector, CLI and C SDK distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-github-release.py "$RELEASE_TAG" --collected target/collected
