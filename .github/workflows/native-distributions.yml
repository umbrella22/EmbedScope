name: Native distributions

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit or release tag
        required: true
        type: string
      release_tag:
        description: Verify the public tag when publishing a release
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Verify release source
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release.py identity "$RELEASE_TAG"
      - name: Test native host
        run: cargo test --workspace --locked
      - name: Build and launch the distribution packages
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py binaries --target "$TARGET"
      - name: Retain platform archives
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error
          retention-days: 30
