name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      distributions:
        description: Build and launch all native distribution packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux, native LVGL, C SDK and crates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          targets: riscv32imafc-unknown-none-elf
      - name: Test release failure controls
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify workspace and device integrations
        run: bash scripts/check.sh
      - name: Verify source archives and independent consumers
        run: python3 scripts/release.py verify
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-source-packages
          path: |
            target/dist/
            target/validation/*/receipt.json
          if-no-files-found: warn
          retention-days: 14

  host:
    name: Host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: cargo test --workspace --locked
      - run: cargo build -p escope-cli --locked
      - run: python3 scripts/check-e2e.py

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: '1.88.0'
            packages: -p escope-protocol -p escope-agent -p escope-lvgl -p escope-c-api -p escope-host -p escope-cli
          - toolchain: '1.95.0'
            packages: -p escope-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Check declared minimum Rust version
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra package_args <<< "$PACKAGES"
          cargo check --locked "${package_args[@]}"

  distributions:
    name: Validate native distributions
    if: github.event_name == 'workflow_dispatch' && inputs.distributions
    uses: ./.github/workflows/native-distributions.yml
    with:
      source_ref: ${{ github.sha }}
