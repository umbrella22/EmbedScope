[package]
name = "escope-lvgl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Host-provided LVGL access bridge for EmbedScope"

[dependencies]
escope-protocol.workspace = true
# Share the application's single links = "lvgl" provider. The native walker
# only needs C bindings, including their effective target configuration.
rs_lvgl_sys = { version = "0.6.0", optional = true }

[features]
default = []
native = ["dep:rs_lvgl_sys"]
