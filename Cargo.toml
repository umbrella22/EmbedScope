[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/escope-protocol", "crates/escope-agent", "crates/escope-host", "crates/escope-cli", "crates/escope-lvgl", "crates/escope-c-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/umbrella22/EmbedScope"

[workspace.dependencies]
escope-protocol = { path = "crates/escope-protocol", version = "0.1.0" }
escope-agent = { path = "crates/escope-agent", version = "0.1.0" }
escope-host = { path = "crates/escope-host", version = "0.1.0" }
escope-lvgl = { path = "crates/escope-lvgl", version = "0.1.0" }
minicbor = { version = "0.25", default-features = false, features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-serial = "5.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
png = "0.17"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
