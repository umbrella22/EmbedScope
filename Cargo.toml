[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/escope-protocol", "crates/escope-agent", "crates/escope-host", "crates/escope-cli", "crates/escope-lvgl", "crates/escope-c-api"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/umbrella22/EmbedScope"
homepage = "https://umbrella22.github.io/EmbedScope_website/"

[workspace.dependencies]
escope-protocol = { path = "crates/escope-protocol", version = "0.1.1" }
escope-agent = { path = "crates/escope-agent", version = "0.1.1" }
escope-host = { path = "crates/escope-host", version = "0.1.1" }
escope-lvgl = { path = "crates/escope-lvgl", version = "0.1.1" }
minicbor = { version = "2.3.1", default-features = false, features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-serial = "5.5.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
png = "0.18.1"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links", "persistence"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
